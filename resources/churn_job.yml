resources:
  jobs:
    churn_pipeline:
      name: streamnet-churn-pipeline
      description: Daily ingest -> features -> train -> score
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: ${var.schedule_status}
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ../src/01_ingest_bronze.py
            base_parameters: { catalog: "${var.catalog}", schema: "${var.schema}" }

        - task_key: transform_silver
          depends_on: [{ task_key: ingest_bronze }]
          notebook_task:
            notebook_path: ../src/02_transform_silver.py
            base_parameters: { catalog: "${var.catalog}", schema: "${var.schema}" }

        - task_key: build_gold
          depends_on: [{ task_key: transform_silver }]
          notebook_task:
            notebook_path: ../src/03_build_features_gold.py
            base_parameters: { catalog: "${var.catalog}", schema: "${var.schema}" }

        - task_key: train_model
          depends_on: [{ task_key: build_gold }]
          notebook_task:
            notebook_path: ../src/04_train_model.py
            base_parameters: { catalog: "${var.catalog}", schema: "${var.schema}" }

        - task_key: batch_score
          depends_on: [{ task_key: train_model }]
          notebook_task:
            notebook_path: ../src/05_batch_score.py
            base_parameters: { catalog: "${var.catalog}", schema: "${var.schema}" }